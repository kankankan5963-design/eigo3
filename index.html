<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>英語ブロックラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout: one phone column. Home = level card + today button + stage list. Quiz = progress bar, card, colored sentence blocks. */
:root{
  --bg:#eef1fb; --panel:#ffffff; --ink:#18203a; --sub:#5b6483; --line:#d6dbef; --soft:#e4e8f7;
  --accent:#6b4dff; --accent-soft:#e7e1ff;
  --s:#2f6fe8; --s-soft:#dce8ff;   /* subject: だれが */
  --v:#e2483f; --v-soft:#fde1df;   /* verb: どうする */
  --n:#c98a00; --n-soft:#fff1cc;   /* noun being described */
  --m:#0f9a72; --m-soft:#d6f5ea;   /* modifier: 説明 */
  --ok:#14955f; --ok-soft:#d9f4e7; --ng:#d33b3b; --ng-soft:#fde0e0;
  --font-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-en:"Lexend","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-dot:"DotGothic16","M PLUS Rounded 1c",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1124; --panel:#181c36; --ink:#eceffd; --sub:#9ba3c6; --line:#2c3260; --soft:#222850;
  --accent:#9d86ff; --accent-soft:#2e2766;
  --s:#6d9dff; --s-soft:#1d2e5c; --v:#ff7a72; --v-soft:#4a2224; --n:#f2be3d; --n-soft:#43361a; --m:#3fd3a2; --m-soft:#153e33;
  --ok:#43d18f; --ok-soft:#173d2c; --ng:#ff6d6d; --ng-soft:#4a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1124; --panel:#181c36; --ink:#eceffd; --sub:#9ba3c6; --line:#2c3260; --soft:#222850;
  --accent:#9d86ff; --accent-soft:#2e2766;
  --s:#6d9dff; --s-soft:#1d2e5c; --v:#ff7a72; --v-soft:#4a2224; --n:#f2be3d; --n-soft:#43361a; --m:#3fd3a2; --m-soft:#153e33;
  --ok:#43d18f; --ok-soft:#173d2c; --ng:#ff6d6d; --ng-soft:#4a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--font-en)}
.dot{font-family:var(--font-dot);letter-spacing:.04em}
h1,h2,h3{margin:0;text-wrap:balance}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub{color:var(--sub);font-size:.88rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 16px;font-weight:800;font-size:1.05rem;background:var(--soft);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:9px 12px;font-size:.9rem;width:auto;border-radius:11px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-dot);font-size:1.25rem}
.logo .blk{display:inline-flex;gap:2px}
.logo .blk i{width:10px;height:18px;border-radius:3px;display:block}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* level card */
.lv{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.emblem{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--s)));color:#fff;font-family:var(--font-dot);font-size:1.6rem;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.lv .ttl{font-family:var(--font-dot);font-size:1.15rem}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count div{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.count b{display:block;font-family:var(--font-dot);font-size:1.4rem;font-weight:400;font-variant-numeric:tabular-nums}
.count span{font-size:.72rem;color:var(--sub)}
.theme{border-left:4px solid var(--n);padding:4px 10px;background:var(--n-soft);border-radius:0 10px 10px 0;font-size:.9rem}

/* stages */
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.stage .no{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-dot);font-size:1.1rem;color:#fff}
.stage .nm{font-weight:800;font-size:.98rem}
.stage .bar{height:7px;margin-top:4px}
.stage .pc{font-family:var(--font-dot);color:var(--sub);font-size:.9rem;font-variant-numeric:tabular-nums}
.stage.focus{border:2px solid var(--n)}

/* chips (sentence blocks) */
.seg{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-start;font-family:var(--font-en);font-size:1.02rem}
.chip{display:inline-flex;flex-direction:column;align-items:center;border-radius:9px;padding:3px 9px 2px;line-height:1.35;border:2px solid transparent}
.chip small{font-family:var(--font-ui);font-size:.62rem;font-weight:800;line-height:1.2;white-space:nowrap}
.chip.S{background:var(--s-soft);border-color:var(--s)}.chip.S small{color:var(--s)}
.chip.V{background:var(--v-soft);border-color:var(--v)}.chip.V small{color:var(--v)}
.chip.N{background:var(--n-soft);border-color:var(--n);border-style:solid;border-width:2.5px}.chip.N small{color:var(--n)}
.chip.M{background:var(--m-soft);border-color:var(--m);border-style:dashed}.chip.M small{color:var(--m)}
.chip.X{background:transparent;border-color:transparent;padding-inline:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* quiz */
.qtop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.combo{font-family:var(--font-dot);font-size:.95rem;color:var(--n);min-width:70px;text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.prompt{font-size:1.12rem;font-weight:800}
.ensent{font-family:var(--font-en);font-size:1.15rem;line-height:1.7}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 4px}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:13px 14px;border-radius:13px;background:var(--soft);border:2px solid var(--line);font-weight:700;font-size:1rem}
.choice.en{font-family:var(--font-en);font-weight:600}
.choice.ok{background:var(--ok-soft);border-color:var(--ok)}
.choice.ng{background:var(--ng-soft);border-color:var(--ng)}
.slot{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blk{font-family:var(--font-en);font-weight:600;font-size:1rem;padding:9px 13px;border-radius:11px;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.slot .blk{background:var(--accent-soft);border-color:var(--accent);box-shadow:none}
.blk.ok{background:var(--ok-soft);border-color:var(--ok)}
.blk.ng{background:var(--ng-soft);border-color:var(--ng)}
.tin{width:100%;font-family:var(--font-en);font-size:1.15rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.passage{background:var(--soft);border-radius:12px;padding:12px 14px;font-family:var(--font-en);font-size:.98rem;line-height:1.75;max-height:280px;overflow:auto}
.passage .notes{font-family:var(--font-ui);font-size:.78rem;color:var(--sub);margin-top:8px}
.play{display:flex;gap:10px;justify-content:center}
.play .bigplay{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.play .bigplay svg{width:38px;height:38px;fill:currentColor}
.spk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:800;color:var(--accent);padding:6px 10px;border-radius:10px;background:var(--accent-soft)}
.spk svg{width:16px;height:16px;fill:currentColor}

/* feedback */
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.ng{background:var(--ng-soft);border-color:var(--ng)}
.stamp{font-family:var(--font-dot);font-size:1.5rem;display:flex;align-items:center;gap:10px}
.fb.ok .stamp{color:var(--ok)}.fb.ng .stamp{color:var(--ng)}
.ans{font-family:var(--font-en);font-weight:700;font-size:1.05rem}
.exp{display:flex;flex-direction:column;gap:8px}
.exp div{background:var(--panel);border-radius:11px;padding:9px 11px;font-size:.93rem}
.exp b{display:block;font-size:.75rem;color:var(--accent);letter-spacing:.06em}

/* bursts */
.burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.burst div{font-family:var(--font-dot);font-size:clamp(2.4rem,12vw,4.2rem);color:var(--n);text-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop 1s ease-out forwards;text-align:center;line-height:1.1}
.burst div small{display:block;font-size:.4em;color:var(--ink)}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.05) translateY(-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst div{animation:none;opacity:1}.bar>i{transition:none}}

/* lesson */
.slide{display:flex;flex-direction:column;gap:12px}
.slide p{margin:0}
.ex-box{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;flex-wrap:wrap;gap:6px}
.jchip{padding:4px 10px;border-radius:9px;font-weight:800;border:2px solid}
.swap{transition:transform .6s,opacity .6s}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tbl th{background:var(--soft)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}

/* result + parent */
.big{font-family:var(--font-dot);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:10px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.badge.on{background:var(--n-soft);color:var(--ink);border-color:var(--n)}
.badge svg{width:16px;height:16px}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.chart div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div.none{background:var(--soft)}
.clabels{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.62rem;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column;gap:6px}
.weak div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.88rem}
.weak .en{font-weight:600}
.note{font-size:.8rem;color:var(--sub)}
.sync{font-size:.75rem;color:var(--sub);text-align:center}
/* word help */
.w{cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--sub) 70%,transparent);border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.hit{background:var(--n-soft)}
.whelp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wbtn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:800;padding:6px 11px;border-radius:10px;background:var(--n-soft);color:var(--ink);border:1px solid var(--n)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.witem{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.85rem;line-height:1.35;min-width:0}
.witem b{font-family:var(--font-en);display:block;font-size:.95rem}
.witem.hit{border-color:var(--n);background:var(--n-soft)}
details.wd summary{cursor:pointer;font-weight:800;font-size:.88rem;color:var(--accent)}
details.wd[open] summary{margin-bottom:8px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:2px solid var(--n);box-shadow:0 -8px 24px rgba(0,0,0,.18);border-radius:18px 18px 0 0;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet .inner{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet .wd-en{font-family:var(--font-en);font-size:1.5rem;font-weight:700}
.sheet .wd-jp{font-size:1.05rem;font-weight:700}
</style>

<div class="wrap" id="app"></div>
<div id="fx"></div>
<div id="sheet"></div>

<script>
/* ===== 設定：自動記録用のApps ScriptのURL（空のときはこの端末の中だけに保存） ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwdGGBEkZ_k0ucRhh9Jx6OPqw8Vuk5UgbyW9GLyrlt5iRsibl8yDbUPr4_m9L3C6HIBFQ/exec";
const TEST_DATE = "2026-11-13";

/* ===== 問題データ（教科書・ワークの範囲に合わせたオリジナル問題） ===== */
const STAGES = [
  {k:"s1",nm:"文の骨組み",short:"骨組み",col:"var(--s)",jp:"日本語は「私は／サッカーが／好き」と動詞が最後。英語は「I／like／soccer」と、2番目にすぐ動詞が来る。"},
  {k:"s2",nm:"名詞を後ろから説明",short:"後ろ説明",col:"var(--m)",jp:"日本語は説明が名詞の前（テーブルの上の→ペン）。英語は名詞が先、説明が後ろ（the pen ← on the table）。"},
  {k:"s3",nm:"関係代名詞 who / which / that",short:"関係代名詞",col:"var(--accent)",jp:"日本語には関係代名詞がない。英語の who / which / that は「ここから前の名詞の説明が始まるよ」という合図。"},
  {k:"s4",nm:"接触節（that を省いた形）",short:"接触節",col:"var(--n)",jp:"日本語の「私が買った本」と発想は同じ。ただし順番が逆で、the book が先、I bought が後ろ。"},
  {k:"s5",nm:"want 人 to ～ / help 人 ～",short:"want人to",col:"var(--v)",jp:"日本語は「あなたに～してほしい」と「に」で表す。英語は want のすぐ後ろに相手を置き、to＋動詞を続ける。"},
  {k:"cul",nm:"日本文化を英語で紹介",short:"日本文化",col:"#d0559c",jp:"日本語をそのまま訳さず、英語にしやすい簡単な日本語に言いかえてから訳すのがコツ。"},
  {k:"voc",nm:"テスト範囲の単語・熟語",short:"単語",col:"#7a8a2a",jp:"スペルは音のかたまりで覚えると楽。sad＋ness、evolu＋tion のように分けてみよう。"},
  {k:"lis",nm:"リスニング",short:"リスニング",col:"#1f8fb3",jp:"聞こえた順番のまま、かたまりごとに意味をとろう。日本語の順に並べ替えようとしない。"},
  {k:"read",nm:"長文読解",short:"長文",col:"#8a5a2b",jp:"長文は最後の段落に書き手の言いたいことがあることが多い。問題を先に読んでから本文を読もう。"}
];
const Q = [];
const c=(q,o,ex,more)=>Object.assign({t:"c",q,o,ex},more||{});
const o=(jp,b,ex,seg)=>({t:"o",jp,b:b.split("/"),ex,seg});
const y=(jp,s,a,ex,seg)=>({t:"y",jp,s,a:a.split(","),ex,seg});
function add(st,arr){arr.forEach((x,i)=>{x.st=st;x.id=st+"-"+(i+1);Q.push(x)})}

add("s1",[
 c("英語の文で、ふつう2番目に来るのは？",["動詞（どうする）","名詞（なにを）","場所（どこで）","時（いつ）"],"英語は「だれが→どうする→なにを→どこで→いつ」の順。2番目は必ず動詞と覚えよう。||動詞を最後に置いてしまう（日本語の順番のくせ）。"),
 c("「私はネコが好きです」を正しく英語にすると？",["I like cats.","I cats like.","Like I cats.","Cats I like."],"だれが(I)→どうする(like)→なにを(cats)。||日本語の順に I cats like としてしまう。",{seg:"{S|I} {V|like} cats."}),
 c("次の文の「だれが（主語）」はどれ？",["Our teacher","speaks","three languages","languages"],"文の最初にある、動作をする人・ものが主語。speaks の前にある Our teacher が主語。",{en:"Our teacher speaks three languages.",seg:"{S|Our teacher} {V|speaks} three languages."}),
 c("次の文の「どうする（動詞）」はどれ？",["plays","Mika","the piano","after school"],"主語 Mika のすぐ後ろが動詞 plays。",{en:"Mika plays the piano after school.",seg:"{S|Mika} {V|plays} the piano after school."}),
 o("私はサッカーが好きです。","I/like/soccer","だれが(I)→どうする(like)→なにを(soccer)の順。","{S|I} {V|like} soccer."),
 o("ケンは毎朝走ります。","Ken/runs/every morning","「いつ」を表す every morning は文の最後。","{S|Ken} {V|runs} every morning."),
 o("私の姉は英語を勉強しています。","My sister/is studying/English","is studying で「勉強している」。2つの単語で1つの動詞のかたまり。","{S|My sister} {V|is studying} English."),
 o("彼らは昨日その映画を見ました。","They/watched/the movie/yesterday","「なにを(the movie)」の後に「いつ(yesterday)」。","{S|They} {V|watched} the movie yesterday."),
 o("私の父は駅で働いています。","My father/works/at the station","「どこで」は at the station。動詞 works の後ろに置く。","{S|My father} {V|works} at the station."),
 y("私たちは公園でテニスをします。","We ___ tennis in the park.","play","スポーツを「する」は play。主語 We のすぐ後ろが動詞。","{S|We} {V|play} tennis in the park.")
]);

/* 英文の単語を、タップで意味が出る形にする */
function wrapEn(text){
  return String(text).split(/(<br>)/).map(part=>part==="<br>"?part:part.split(/([A-Za-z][A-Za-z']*)/).map((t,i)=>{
    if(i%2===0)return esc(t);
    const m=lookup(t);return m?`<span class="w${(S.unk||{})[wkey(t)]?" hit":""}" data-w="${esc(wkey(t))}">${esc(t)}</span>`:esc(t);
  }).join("")).join("");
}
function wordsIn(texts,hide){
  const seen=new Set(),out=[];
  texts.filter(Boolean).join(" ").replace(/<br>/g," ").replace(/\{\w\|/g," ").replace(/_{2,}/g," ").replace(/\(　\)/g," ").split(/[^A-Za-z']+/).forEach(t=>{
    const k=wkey(t);if(!k||seen.has(k)||(hide&&hide.has(k))||!lookup(k))return;seen.add(k);out.push(k)});
  return out;
}
function wordListHTML(ws){return`<div class="wlist">${ws.map(k=>`<button class="witem${(S.unk||{})[k]?" hit":""}" data-wi="${esc(k)}"><b>${esc(k)}</b>${esc(lookup(k))}</button>`).join("")}</div>`}
function qWords(q,after){
  if(q.p&&!after)return[];
  const hide=new Set();
  if(!after){(q.o||[]).concat(q.a||[]).join(" ").split(/[^A-Za-z']+/).forEach(t=>t&&hide.add(wkey(t)))}
  const texts=[q.en,q.t==="y"&&q.st!=="voc"?q.s:null,...(q.b||[])];
  if(after)texts.push(q.say,q.seg,...(q.o||[]),...(q.a||[]),q.st==="voc"&&q.t==="c"?q.q.split(" の意味")[0]:null);
  else if(q.st!=="lis")texts.push(q.say);
  return wordsIn(texts,hide);
}

const ROLE={S:"だれが",V:"どうする",N:"説明される名詞",M:"↩ 後ろから説明"};
function segHTML(seg){
  if(!seg)return"";
  const out=[];let last=0;const re=/\{(\w)\|([^}]+)\}/g;let m;
  while((m=re.exec(seg))){
    const pre=seg.slice(last,m.index).trim();
    if(pre)out.push(`<span class="chip X">${wrapEn(pre)}<small>&nbsp;</small></span>`);
    out.push(`<span class="chip ${m[1]}">${wrapEn(m[2])}<small>${ROLE[m[1]]}</small></span>`);
    last=re.lastIndex;
  }
  const rest=seg.slice(last).trim();
  if(rest)out.push(`<span class="chip X">${wrapEn(rest)}<small>&nbsp;</small></span>`);
  return`<div class="seg">${out.join("")}</div>`;
}

let voice=null;

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,slow){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<br>/g," ").replace(/\(　\)/g," blank "));u.lang="en-US";if(voice)u.voice=voice;u.rate=slow?0.6:0.9;speechSynthesis.speak(u)}catch(e){}
}
function sayText(q){
  if(q.say)return q.say;
  if(q.t==="o")return q.b.join(" ");
  if(q.t==="y"&&/[a-z]/i.test(q.s)&&!/_{3,}$/.test(q.s.trim())&&q.st!=="voc")return q.s.replace(/_{3,}/,q.a[0]);
  if(q.t==="y"&&q.st==="voc")return q.a[0];
  if(q.en)return q.en.replace("(　)",q.o[0]);
  if(q.st==="voc")return q.q.split(" の意味")[0].replace(/～/g,"").trim();
  if(/^[A-Z"]/.test(q.o[0]))return q.o[0];
  return"";
}

    let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}
}
function burst(main,sub){const fx=$("#fx");fx.innerHTML=`<div class="burst"><div>${main}${sub?`<small>${sub}</small>`:""}</div></div>`;setTimeout(()=>{fx.innerHTML=""},1100)}

/* ===== レベル計算 ===== */
function lvOf(xp){let l=0;while(l<LV.length-1&&xp>=LV[l+1])l++;return l}
function streak(){let n=0,d=TODAY();if(!S.days[dayStr(d)])d--;while(S.days[dayStr(d)]){n++;d--}return n}
function dayStr(n){const t=new Date(n*864e5);return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")+"-"+String(t.getUTCDate()).padStart(2,"0")}
function mastery(st){const qs=Q.filter(q=>q.st===st);const m=qs.filter(q=>(S.items[q.id]||{}).b>=3).length;return{m,t:qs.length,p:Math.round(m/qs.length*100)}}

/* ===== 出題の組み立て ===== */
const ORDER=["s1","s2","s3","s4","s5","cul","voc","lis","read"];
function buildDaily(){
  const t=TODAY(),plan=planToday();
  const seen=Q.filter(q=>S.items[q.id]);
  const due=seen.filter(q=>S.items[q.id].d<=t).sort((a,b)=>{const A=S.items[a.id],B=S.items[b.id];return(A.l===0?0:1)-(B.l===0?0:1)||A.b-B.b});
  const set=[];const pushQ=q=>{if(set.length<20&&!set.includes(q)){if(q.st==="read"&&set.filter(x=>x.st==="read").length>=3)return;set.push(q)}};
  due.slice(0,plan.review?20:12).forEach(pushQ);
  if(plan.review){seen.slice().sort((a,b)=>S.items[a.id].b-S.items[b.id].b||S.items[b.id].w-S.items[a.id].w).forEach(pushQ)}
  plan.st.forEach(st=>Q.filter(q=>q.st===st&&!S.items[q.id]).forEach(pushQ));
  ORDER.forEach(st=>Q.filter(q=>q.st===st&&!S.items[q.id]).forEach(pushQ));
  seen.slice().sort((a,b)=>S.items[a.id].b-S.items[b.id].b).forEach(pushQ);
  return set;
}
function buildStage(st){
  const qs=Q.filter(q=>q.st===st);
  const un=qs.filter(q=>!S.items[q.id]);
  const rest=qs.filter(q=>S.items[q.id]).sort((a,b)=>S.items[a.id].b-S.items[b.id].b);
  return un.concat(rest).slice(0,st==="read"?9:10);
}

function judge(ok,correct){
  const c=sess.cur,q=c.q;c.answered=true;

    sess.t++;it.s++;
    if(ok){sess.c++;it.c++;it.b=Math.min(it.b+1,5);it.l=1}else{it.w++;it.b=0;it.l=0;sess.wrong.push(q.id)}
    it.d=TODAY()+INTERVAL[it.b];S.items[q.id]=it;S.total++;
  }
  let gain=0;
  if(ok){sess.combo++;sess.maxCombo=Math.max(sess.maxCombo,sess.combo);gain=first?10+(sess.combo>=3?5:0):3}
  else{sess.combo=0;if(!sess.requeued[q.id]){sess.requeued[q.id]=1;sess.list.push(q)}}
  sess.xp+=gain;S.xp+=gain;
  beep(ok?"ok":"ng");
  if(ok&&[3,5,10,15,20].includes(sess.combo)){burst(sess.combo+" COMBO!",sess.combo>=10?"止まらない！":sess.combo>=5?"いい流れ！":"その調子！");beep("combo")}
  $("#cb").textContent=sess.combo>=2?sess.combo+" COMBO":"";

    ${ok?"":`<div><div class="sub">正しい答え</div><div class="ans">${wrapEn(correct)}</div></div>`}
    ${q.seg?`<div>${segHTML(q.seg)}</div>`:""}
    ${say?`<button class="spk" id="fsp" style="align-self:flex-start">${ICON.spk}英文を聞く</button>`:""}

  <div class="card" style="text-align:center;align-items:center">
    <div class="sub">${esc(sess.label)}</div>
    <div class="big">${sess.c}<span style="font-size:.45em">/${sess.t}</span></div>
    <div class="sub">正答率 ${pct}%　最大 ${sess.maxCombo} コンボ　+${sess.xp} XP</div>
    ${up?`<div class="panel" style="width:100%;border:2px solid var(--n)"><div class="dot" style="font-size:1.2rem">LEVEL UP!</div><div>Lv.${l+1}「${TITLES[l]}」になった！</div></div>`:""}
    ${newB.length?`<div style="width:100%"><div class="sub">新しいバッジ</div><div class="badges" style="justify-content:center">${newB.map(n=>`<span class="badge on">${ICON.star}${n}</span>`).join("")}</div></div>`:""}
    ${sess.wrong.length?`<div class="sub">まちがえた ${sess.wrong.length} 問は、明日の復習に自動で入ります。</div>`:`<div class="sub">全問正解！ 明日はさらにレベルの高い問題が出ます。</div>`}
  </div>
  <button class="btn primary" id="again">もう1回（10問）</button>
  <button class="btn" id="hm">ホームへ</button>
  <div class="sync" id="syncmsg">${GAS_URL?"記録を送っています…":""}</div>`;
  if(up){beep("lv");burst("LEVEL UP!",TITLES[l])}
  $("#again").onclick=()=>startQuiz(buildDaily().slice(0,10),"もう1回");
  $("#hm").onclick=home;
  pushRemote(entry);
}

/* ===== 自動記録（Apps Script） ===== */
async function pushRemote(entry){
  if(!GAS_URL)return;
  try{
    await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({state:S,log:entry})});
    const m=$("#syncmsg");if(m)m.textContent="記録をおうちの人に送りました";
  }catch(e){const m=$("#syncmsg");if(m)m.textContent="記録を送れませんでした。次回まとめて送ります"}
}
async function pullRemote(){
  if(!GAS_URL)return null;
  try{const r=await fetch(GAS_URL+"?t="+Date.now());const j=await r.json();return j&&j.items?Object.assign(blank(),j):null}catch(e){return null}
}

/* ===== 保護者ページ ===== */
async function parentView(){
  speakStop();
  app.innerHTML=`<div class="top"><button class="iconbtn" id="bk" aria-label="もどる">${ICON.back}</button><h2 style="font-size:1.1rem">保護者ページ</h2><span style="width:40px"></span></div><div class="panel sub">読み込み中…</div>`;
  $("#bk").onclick=home;
  const R=(await pullRemote())||S;
  const t=TODAY();const days=[];for(let i=13;i>=0;i--){const k=dayStr(t-i);days.push({k,v:R.days[k]})}
  const lastLog=R.log.slice(-8).reverse();
  const weak=Q.filter(q=>R.items[q.id]&&R.items[q.id].w>0).sort((a,b)=>R.items[b.id].w-R.items[a.id].w||R.items[a.id].b-R.items[b.id].b).slice(0,10);
  const sk=(()=>{let n=0,d=t;if(!R.days[dayStr(d)])d--;while(R.days[dayStr(d)]){n++;d--}return n})();
  const td=R.days[ymd()];
  const mast=k=>{const qs=Q.filter(q=>q.st===k);const m=qs.filter(q=>(R.items[q.id]||{}).b>=3).length;const s=qs.filter(q=>R.items[q.id]).length;return{m,s,t:qs.length}};
  const qtext=q=>q.t==="o"?q.jp+" → "+q.b.join(" "):q.t==="y"?q.jp+" → "+q.a[0]:(q.en||q.q)+" → "+q.o[0];
  app.innerHTML=`
  <div class="top"><button class="iconbtn" id="bk" aria-label="もどる">${ICON.back}</button><h2 style="font-size:1.1rem">保護者ページ</h2><span style="width:40px"></span></div>
  <div class="count">
    <div><b>${daysLeft()>0?daysLeft():"-"}</b><span>テストまで（日）</span></div>
    <div><b>${sk}</b><span>連続日数</span></div>
    <div><b>${td?Math.round(td.c/td.t*100)+"%":"-"}</b><span>今日の正答率</span></div>
  </div>
  <div class="panel">
    <h3 style="font-size:.95rem;margin-bottom:10px">2週間の正答率</h3>
    <div class="chart">${days.map(d=>d.v?`<div style="height:${Math.max(4,Math.round(d.v.c/d.v.t*100))}%" title="${d.k} ${d.v.c}/${d.v.t}"></div>`:`<div class="none"></div>`).join("")}</div>
    <div class="clabels">${days.map(d=>`<span>${+d.k.slice(8)}</span>`).join("")}</div>
  </div>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <h3 style="font-size:.95rem">分野ごとの習得（★＝3回以上続けて正解）</h3>
    ${STAGES.map(s=>{const m=mast(s.k);return`<div><div class="row" style="justify-content:space-between"><span style="font-size:.9rem;font-weight:700">${s.nm}</span><span class="sub" style="font-variant-numeric:tabular-nums">★${m.m}／解いた${m.s}／全${m.t}</span></div><div class="bar"><i style="width:${Math.round(m.m/m.t*100)}%;background:${s.col}"></i></div></div>`}).join("")}
  </div>
  <div class="panel">
    <h3 style="font-size:.95rem;margin-bottom:8px">苦手な問題（まちがえた回数が多い順）</h3>
    <div class="weak">${weak.length?weak.map(q=>`<div><span class="tag">${stage(q.st).short} ×${R.items[q.id].w}</span><div class="en">${esc(qtext(q))}</div></div>`).join(""):'<div class="sub">まだありません</div>'}</div>
  </div>
  <div class="panel">
    <h3 style="font-size:.95rem;margin-bottom:8px">意味を調べた単語（回数が多い順）</h3>
    <div class="weak">${Object.keys(R.unk||{}).length?Object.entries(R.unk).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,n])=>`<div><span class="en" style="font-weight:700">${esc(k)}</span>　${esc(lookup(k)||"")}　<span class="sub">×${n}</span></div>`).join(""):'<div class="sub">まだありません</div>'}</div>
  </div>
  <div class="panel">
    <h3 style="font-size:.95rem;margin-bottom:8px">最近の記録</h3>
    <div class="weak">${lastLog.length?lastLog.map(e=>`<div>${e.d}　${esc(e.mode)}　<b>${e.c}/${e.t}</b>（${e.pct}%）</div>`).join(""):'<div class="sub">まだありません</div>'}</div>
  </div>
  <div class="note">${GAS_URL?"息子さんのスマホの最新の記録を表示しています。":"今はこの端末の記録を表示しています（自動記録の設定前）。"}</div>`;
  $("#bk").onclick=home;
}

/* ===== 起動 ===== */
const app=$("#app");
(async function boot(){
  const isParent=new URLSearchParams(location.search).get("view")==="parent"||location.hash==="#parent";
  if(isParent){parentView();return}
  home();
  const R=await pullRemote();
  if(R&&(R.upd||0)>(S.upd||0)){S=R;save();if(!sess)home()}
})();
</script>
